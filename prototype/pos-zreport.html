<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>POS Z-Report / Close Session — UI Prototype (THROWAWAY)</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: system-ui, -apple-system, sans-serif; }
  .variant { display: none; } .variant.active { display: block; }
  .switcher { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 9999; }
  .switcher button { background: #111; color: #fff; border: 1px solid #333; }
  .switcher button:hover { background: #333; }
  .denom-row { display:flex; align-items:center; gap:8px; padding:4px 0; border-bottom:1px solid #eee; }
</style>
</head>
<body class="bg-gray-100 text-gray-900">

<script>
// Cash denominations
const DENOMS = [
  {key:"100",val:100,cat:"bills"},{key:"50",val:50,cat:"bills"},{key:"20",val:20,cat:"bills"},
  {key:"10",val:10,cat:"bills"},{key:"5",val:5,cat:"bills"},{key:"2",val:2,cat:"bills"},
  {key:"1",val:1,cat:"bills"},{key:"0.25",val:0.25,cat:"coins"},{key:"0.10",val:0.10,cat:"coins"},
  {key:"0.05",val:0.05,cat:"coins"},{key:"0.01",val:0.01,cat:"coins"},
];
// mock session
const SESSION = {
  id: 7, cashier: "Alex", opened: "2026-11-06 09:00", startingCash: 100.00,
  sales: 42, voids: 1, grossSales: 1280.50, discounts: 35.00, netSales: 1245.50,
  byPayment: { cash: 612.30, card: 520.00, split: 80.20, invoice: 33.00 },
  byCategory: { Drinks: 480.00, Food: 610.50, Snacks: 155.00 },
};
let counts = {}; DENOMS.forEach(d=>counts[d.key]=0);
let backupDone = false;
const variants = ["A","B","C"], names = {A:"Wizard steps", B:"Single page", C:"Compact modal"};

function getVariant(){ const p=new URLSearchParams(location.search); return variants.includes(p.get("variant"))?p.get("variant"):"A"; }
function setVariant(v){ const u=new URL(location.href); u.searchParams.set("variant",v); history.replaceState(null,"",u); render(); }
function cycle(d){ const i=variants.indexOf(getVariant()); setVariant(variants[(i+d+variants.length)%variants.length]); }

function countedTotal(){ return DENOMS.reduce((s,d)=>s + d.val*(counts[d.key]||0), 0); }
function expectedCash(){ return SESSION.startingCash + SESSION.byPayment.cash; }
function variance(){ return expectedCash() - countedTotal(); }

function setCount(key, val){ counts[key] = Math.max(0, parseInt(val)||0); render(); }
function doBackup(){ backupDone=true; render(); alert("Backup written to configured path (last 7 retained)."); }
function closeSession(){ alert("Session closed. Z-report saved. Backup triggered."); }

function renderDenomRows(container){
  const bills = DENOMS.filter(d=>d.cat==="bills"), coins = DENOMS.filter(d=>d.cat==="coins");
  const mk = (d) => `<div class="denom-row">
    <span class="w-12 text-sm font-medium">$${d.val.toFixed(2)}</span>
    <input type="number" min="0" value="${counts[d.key]}" class="w-20 px-2 py-1 border rounded text-sm"
      oninput="setCount('${d.key}', this.value)" />
    <span class="text-sm text-gray-500">= $${(d.val*(counts[d.key]||0)).toFixed(2)}</span>
  </div>`;
  container.innerHTML = `
    <div class="mb-2"><div class="text-xs uppercase text-gray-500 mb-1">Bills</div>${bills.map(mk).join("")}</div>
    <div><div class="text-xs uppercase text-gray-500 mb-1">Coins</div>${coins.map(mk).join("")}</div>
  `;
}
function renderSummary(el){
  el.innerHTML = `
    <div class="grid grid-cols-2 gap-2 text-sm">
      <div class="bg-gray-50 p-2 rounded"><div class="text-gray-500 text-xs">Sales</div><div class="font-bold">${SESSION.sales}</div></div>
      <div class="bg-gray-50 p-2 rounded"><div class="text-gray-500 text-xs">Voids</div><div class="font-bold">${SESSION.voids}</div></div>
      <div class="bg-gray-50 p-2 rounded"><div class="text-gray-500 text-xs">Gross</div><div class="font-bold">$${SESSION.grossSales.toFixed(2)}</div></div>
      <div class="bg-gray-50 p-2 rounded"><div class="text-gray-500 text-xs">Discounts</div><div class="font-bold">-$${SESSION.discounts.toFixed(2)}</div></div>
      <div class="bg-gray-50 p-2 rounded col-span-2"><div class="text-gray-500 text-xs">Net sales</div><div class="font-bold text-lg">$${SESSION.netSales.toFixed(2)}</div></div>
    </div>
    <div class="mt-3 text-xs">
      <div class="font-semibold mb-1">By payment</div>
      ${Object.entries(SESSION.byPayment).map(([k,v])=>`<div class="flex justify-between"><span class="capitalize">${k}</span><span>$${v.toFixed(2)}</span></div>`).join("")}
    </div>
    <div class="mt-3 text-xs">
      <div class="font-semibold mb-1">By category</div>
      ${Object.entries(SESSION.byCategory).map(([k,v])=>`<div class="flex justify-between"><span>${k}</span><span>$${v.toFixed(2)}</span></div>`).join("")}
    </div>`;
}
function renderCashBlock(el){
  const exp=expectedCash(), cnt=countedTotal(), varr=variance();
  el.innerHTML = `
    <div class="grid grid-cols-3 gap-2 text-sm mb-3">
      <div class="bg-blue-50 p-2 rounded"><div class="text-xs text-gray-500">Starting cash</div><div class="font-bold">$${SESSION.startingCash.toFixed(2)}</div></div>
      <div class="bg-blue-50 p-2 rounded"><div class="text-xs text-gray-500">Cash sales</div><div class="font-bold">$${SESSION.byPayment.cash.toFixed(2)}</div></div>
      <div class="bg-blue-50 p-2 rounded"><div class="text-xs text-gray-500">Expected</div><div class="font-bold">$${exp.toFixed(2)}</div></div>
    </div>
    <div class="mb-3">
      <div class="text-xs uppercase text-gray-500 mb-1">Counted cash</div>
      <div class="text-2xl font-bold">$${cnt.toFixed(2)}</div>
    </div>
    <div class="p-2 rounded ${Math.abs(varr)<0.005?'bg-green-100 text-green-700':'bg-red-100 text-red-700'} font-semibold text-sm">
      Over/Short: ${varr>=0?'+':''}$${varr.toFixed(2)}
    </div>`;
}
function render(){
  const v=getVariant();
  document.querySelectorAll(".variant").forEach(el=>el.classList.toggle("active", el.dataset.variant===v));
  document.getElementById("vlabel").textContent = v+" ("+names[v]+")";
  document.querySelectorAll(".summary").forEach(renderSummary);
  document.querySelectorAll(".cashblock").forEach(renderCashBlock);
  document.querySelectorAll(".denomcontainer").forEach(renderDenomRows);
  document.querySelectorAll(".backup-status").forEach(e=>e.textContent = backupDone?"Backup done ✓":"Not backed up");
}
function init(){ document.addEventListener("keydown",(e)=>{const t=e.target;if(t&&(t.tagName==="INPUT"||t.tagName==="TEXTAREA"||t.isContentEditable))return;if(e.key==="ArrowLeft"){cycle(-1);e.preventDefault();}if(e.key==="ArrowRight"){cycle(1);e.preventDefault();}}); }
window.setCount=setCount; window.doBackup=doBackup; window.closeSession=closeSession; window.setVariant=setVariant; window.cycle=cycle;
</script>

<!-- VARIANT A: Wizard steps -->
<div class="variant" data-variant="A">
  <div class="min-h-screen max-w-2xl mx-auto p-4">
    <h1 class="text-xl font-bold mb-4">Close Session #7 — Alex</h1>
    <div class="bg-white rounded-xl shadow p-4 mb-4">
      <h2 class="font-semibold mb-2">1. Session summary</h2>
      <div class="summary"></div>
    </div>
    <div class="bg-white rounded-xl shadow p-4 mb-4">
      <h2 class="font-semibold mb-2">2. Count cash</h2>
      <div class="denomcontainer"></div>
      <div class="cashblock mt-3"></div>
    </div>
    <div class="bg-white rounded-xl shadow p-4 mb-4">
      <h2 class="font-semibold mb-2">3. Backup & close</h2>
      <div class="flex items-center gap-3">
        <button onclick="doBackup()" class="px-4 py-2 bg-gray-800 text-white rounded">Backup to USB</button>
        <span class="backup-status text-sm text-gray-500"></span>
      </div>
      <button onclick="closeSession()" class="mt-3 w-full py-2 bg-blue-600 text-white rounded font-semibold">Close Session & Print Z-Report</button>
    </div>
  </div>
</div>

<!-- VARIANT B: Single page -->
<div class="variant" data-variant="B">
  <div class="h-screen flex">
    <div class="w-1/2 p-4 overflow-y-auto border-r bg-white">
      <h2 class="font-bold mb-3">Session #7 — Alex</h2>
      <div class="summary"></div>
    </div>
    <div class="w-1/2 p-4 overflow-y-auto">
      <h2 class="font-bold mb-3">Cash count</h2>
      <div class="denomcontainer"></div>
      <div class="cashblock mt-3"></div>
      <div class="mt-4 flex gap-2">
        <button onclick="doBackup()" class="px-4 py-2 bg-gray-800 text-white rounded">Backup</button>
        <span class="backup-status text-sm self-center"></span>
      </div>
      <button onclick="closeSession()" class="mt-3 w-full py-2 bg-blue-600 text-white rounded font-semibold">Close & Z-Report</button>
    </div>
  </div>
</div>

<!-- VARIANT C: Compact modal -->
<div class="variant" data-variant="C">
  <div class="min-h-screen flex items-center justify-center p-4 bg-gray-900">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-5">
      <div class="flex justify-between items-center mb-3">
        <h2 class="font-bold">Close Session #7</h2>
        <span class="text-xs text-gray-500">Alex</span>
      </div>
      <div class="summary mb-3"></div>
      <details open class="mb-3">
        <summary class="font-semibold text-sm cursor-pointer">Count cash</summary>
        <div class="denomcontainer mt-2"></div>
        <div class="cashblock mt-2"></div>
      </details>
      <div class="flex gap-2 mb-3">
        <button onclick="doBackup()" class="flex-1 py-2 bg-gray-800 text-white rounded text-sm">Backup</button>
        <span class="backup-status text-xs self-center"></span>
      </div>
      <button onclick="closeSession()" class="w-full py-2 bg-blue-600 text-white rounded font-semibold">Close & Z-Report</button>
    </div>
  </div>
</div>

<div class="switcher flex items-center gap-2 bg-black/90 text-white rounded-full px-3 py-2 shadow-lg">
  <button onclick="cycle(-1)" class="rounded-full w-8 h-8 flex items-center justify-center">◀</button>
  <span id="vlabel" class="text-sm font-medium min-w-[180px] text-center">A (Wizard steps)</span>
  <button onclick="cycle(1)" class="rounded-full w-8 h-8 flex items-center justify-center">▶</button>
</div>

<script>init(); render();</script>
</body>
</html>
